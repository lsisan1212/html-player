<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Player</title>
    <link rel="stylesheet" href="css/site.css?v=3">
</head>
<body>
    <header class="site-header">
        <div class="brand"><span class="brand-mark">▶</span> HTML Player</div>
        <div class="file-name" id="file-name"></div>
        <div class="header-actions">
            <button id="open-btn" class="btn">📂 Open file</button>
            <input id="file-input" type="file" hidden
                   accept="video/*,.mkv,.ts,.m2ts,.avi,.mov,.webm,.mp4,.m4v,.wmv,.flv,.ogv">
        </div>
    </header>

    <main class="stage" id="stage">
        <movi-player id="player" controls wasmurl="vendor/movi/movi.wasm"></movi-player>

        <div id="drop-hint" class="drop-hint">
            <div class="drop-icon">🎬</div>
            <h1>拖放影片到此處</h1>
            <p>或按右上角「Open file」選檔</p>
            <p class="hint-sub">MKV · HEVC · AV1 · HDR · 多音軌 · 內嵌字幕</p>
        </div>
    </main>

    <footer class="site-footer">
        Powered by <a href="https://github.com/MrUjjwalG/movi-player" target="_blank" rel="noopener">Movi Player</a>
        <span class="dot">·</span> Apache-2.0
    </footer>

    <script src="vendor/movi/element.slim.global.js"></script>
    <script src="js/site.js?v=3"></script>
</body>
</html>
